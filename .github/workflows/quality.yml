# This workflow executes untrusted pull-request code. Do not add secrets,
# environments, deployments, or access to privileged external resources.
name: PR-safe typecheck, build, distribution

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck, build, and verify committed distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: configure test result path
        run: echo "CI_TEST_RESULTS_FILE=$RUNNER_TEMP/handelsrepublik-test-results.ndjson" >> "$GITHUB_ENV"
      - name: typecheck TypeScript sources
        continue-on-error: true
        run: npm run test:ci:record -- quality.typecheck "TypeScript typecheck" -- npm run typecheck
      - name: build package distribution
        continue-on-error: true
        run: npm run test:ci:record -- quality.build "Package build" -- npm run build
      - name: verify the committed distribution is current
        continue-on-error: true
        run: npm run test:ci:record -- quality.distribution "Committed distribution" -- git diff --exit-code -- dist
      - name: publish test result table
        if: always()
        run: npm run test:ci:summary -- "Package quality results"
