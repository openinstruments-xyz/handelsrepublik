# This workflow executes untrusted pull-request code. Its environment must
# remain secret-free and must not access privileged external resources.
name: Package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck, build, and verify committed distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck TypeScript sources
        run: npm run typecheck
      - name: build package distribution
        run: npm run build
      - name: verify the committed distribution is current
        run: git diff --exit-code -- dist
