name: live venue-state order integration

on:
  schedule:
    - cron: "30 0 * * 1-5"
      timezone: Europe/Berlin
    - cron: "15 10 * * 1-5"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      instrument_id:
        description: 'ISIN for venue-state order checks.'
        required: true
        type: string
        default: 'US0378331005'
      exchange_id:
        description: 'Exchange that must explicitly report closed (for example LSX).'
        required: true
        type: string
        default: 'LSX'
      open_buy_limit_eur:
        description: 'Deeply non-marketable buy limit used while the exchange is open.'
        required: true
        type: string
        default: '1'
      confirm_order_requests:
        description: 'I understand this sends real orders and cancels any accepted open-venue probe.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-order-rejections-main
  cancel-in-progress: false

jobs:
  rejections:
    name: venue-state EUR 1 buy checks
    if: >-
      github.repository == 'VIEWVIEWVIEW/handelsrepublik' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
        (github.actor == 'VIEWVIEWVIEW' && inputs.confirm_order_requests))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TR_INTEGRATION_ORDER_ISIN: ${{ inputs.instrument_id || 'US0378331005' }}
      TR_INTEGRATION_ORDER_EXCHANGE: ${{ inputs.exchange_id || 'LSX' }}
      TR_INTEGRATION_OPEN_BUY_LIMIT_EUR: ${{ inputs.open_buy_limit_eur || '1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Configure ephemeral session path
        run: echo "TR_SESSION_FILE=$RUNNER_TEMP/trade-republic-session.json" >> "$GITHUB_ENV"
      - name: Materialize encrypted test session
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: node --import tsx scripts/ci-session.ts materialize "$TR_SESSION_FILE"
      - name: Refresh Trade Republic session
        run: node --import tsx scripts/ci-session.ts refresh "$TR_SESSION_FILE"
      - name: Rotate encrypted GitHub session secret
        env:
          GH_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh secret set TR_SESSION_JSON --repo "$GITHUB_REPOSITORY" < "$TR_SESSION_FILE"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Run venue-state order checks
        run: npm run test:integration:order-rejections
      - name: Remove materialized session
        if: always()
        run: rm -f "$TR_SESSION_FILE"
