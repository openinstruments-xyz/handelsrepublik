name: Deploy CI badge worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/ci-badges/**'
      - '.github/workflows/deploy-ci-badge-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ci-badge-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy badge worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          command: deploy --config workers/ci-badges/wrangler.jsonc --keep-vars
