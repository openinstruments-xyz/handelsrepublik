name: "Live: account, market data, and reversible mutations"

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1,11 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: live-integration-tests-main
  queue: max
  cancel-in-progress: false

jobs:
  consolidated-live-validation:
    name: validate account, market data, and reversible mutations
    if: github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Live Integration Tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: configure ephemeral session path
        run: |
          echo "TR_SESSION_FILE=$RUNNER_TEMP/trade-republic-session.json" >> "$GITHUB_ENV"
          echo "CI_TEST_RESULTS_FILE=$RUNNER_TEMP/handelsrepublik-test-results.ndjson" >> "$GITHUB_ENV"
      - name: materialize encrypted test session
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: node --import tsx scripts/ci-session.ts materialize "$TR_SESSION_FILE"
      - name: refresh Trade Republic session once
        id: live-ready
        run: node --import tsx scripts/ci-session.ts refresh "$TR_SESSION_FILE"
      - name: run compatible live blocks concurrently
        if: ${{ !cancelled() && steps.live-ready.outcome == 'success' }}
        continue-on-error: true
        run: npm run test:integration:consolidated
      - name: rotate encrypted GitHub session secret
        if: ${{ always() && steps.live-ready.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
        run: gh secret set TR_SESSION_JSON --repo "$GITHUB_REPOSITORY" < "$TR_SESSION_FILE"
      - name: remove materialized session
        if: always()
        run: rm -f "$TR_SESSION_FILE"
      - name: publish structured badge results
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          CI_BADGE_RESULTS_URL: https://handelsrepublik-ci-badges.99o.workers.dev/results/account-market-mutations
          CI_BADGE_INGEST_TOKEN: ${{ secrets.CI_BADGE_INGEST_TOKEN }}
          CI_BADGE_WORKFLOW: account-market-mutations
        run: npm run test:ci:publish
      - name: publish test result table
        if: always()
        run: npm run test:ci:summary -- "Account, market data, and reversible mutation results"
