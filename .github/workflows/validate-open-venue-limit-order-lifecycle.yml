name: order updates, EUR 1 submit, EUR 0.50 replace, cancel, cleanup

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * 1-5"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      confirm_order_request:
        description: 'I understand this sends, replaces, and cancels real deeply non-marketable limit orders.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-tr-session-main
  queue: max
  cancel-in-progress: false

jobs:
  time-gate:
    name: require weekdays 09:30–17:00 Europe/Berlin
    if: >-
      github.repository == 'VIEWVIEWVIEW/handelsrepublik' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' ||
        (github.actor == 'VIEWVIEWVIEW' && inputs.confirm_order_request))
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.clock.outputs.eligible }}
    steps:
      - id: clock
        name: validate open-market time window
        env:
          TZ: Europe/Berlin
        run: |
          weekday=$(date +%u)
          minutes=$((10#$(date +%H) * 60 + 10#$(date +%M)))
          if (( weekday <= 5 && minutes >= 570 && minutes < 1020 )); then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            result="✅ Passed"
            note="Inside weekdays 09:30–17:00 Europe/Berlin; the lifecycle test will run."
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping outside weekdays 09:30–17:00 Europe/Berlin."
            result="⏭️ Skipped"
            note="Outside weekdays 09:30–17:00 Europe/Berlin."
          fi
          {
            echo "## Open-market time gate"
            echo ""
            echo "| Test | Result | Notes |"
            echo "|---|:---:|---|"
            echo "| Open-market eligibility | $result | $note |"
          } >> "$GITHUB_STEP_SUMMARY"

  open-limit-order:
    name: stream, submit, replace, cancel, and clean up limit orders
    needs: time-gate
    if: needs.time-gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: live-tr-session
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: configure ephemeral session path
        run: |
          echo "TR_SESSION_FILE=$RUNNER_TEMP/trade-republic-session.json" >> "$GITHUB_ENV"
          echo "CI_TEST_RESULTS_FILE=$RUNNER_TEMP/handelsrepublik-test-results.ndjson" >> "$GITHUB_ENV"
      - name: materialize encrypted test session
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: node --import tsx scripts/ci-session.ts materialize "$TR_SESSION_FILE"
      - name: refresh Trade Republic session
        id: live-ready
        run: node --import tsx scripts/ci-session.ts refresh "$TR_SESSION_FILE"
      - name: validate order-update stream and complete limit-order lifecycle
        continue-on-error: true
        run: npm run test:ci:record -- orders.open-limit-lifecycle "Open-venue limit-order lifecycle" -- npm run test:integration:open-limit-order
      - name: rotate encrypted GitHub session secret
        if: ${{ always() && steps.live-ready.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
        run: gh secret set TR_SESSION_JSON --env live-tr-session --repo "$GITHUB_REPOSITORY" < "$TR_SESSION_FILE"
      - name: remove materialized session
        if: always()
        run: rm -f "$TR_SESSION_FILE"
      - name: publish test result table
        if: always()
        run: npm run test:ci:summary -- "Open-venue limit-order results"
