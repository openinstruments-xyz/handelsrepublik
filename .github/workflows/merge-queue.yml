# GitHub creates this trusted merge-group ref only after a maintainer adds a
# pull request to the native merge queue. All required checks run on that ref.
name: Merge queue

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: merge-queue-${{ github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: verify committed distribution
        run: git diff --exit-code -- dist

  live-integration:
    name: Live Integration
    needs: [unit, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Live Integration Tests
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: materialize the saved session
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: |
          umask 077
          printf '%s' "$TR_SESSION_JSON" > "$RUNNER_TEMP/tr-session.json"
      - name: refresh the saved session locally
        id: refresh
        env:
          TR_SESSION_FILE: ${{ runner.temp }}/tr-session.json
        run: npm run ci:reauth -- --check-session
      - name: run live integration tests
        if: steps.refresh.outputs.session_valid == 'true'
        env:
          TR_SESSION_FILE: ${{ runner.temp }}/tr-session.json
        run: npm run test:integration
      - name: report skipped live tests
        if: steps.refresh.outputs.session_valid == 'false'
        run: echo "Live Integration skipped because the saved session is missing or expired. No login requested; recovery runs daily at 15:00 Europe/Berlin." >> "$GITHUB_STEP_SUMMARY"
      - name: delete the saved session
        if: always()
        run: rm -f "$RUNNER_TEMP/tr-session.json"
