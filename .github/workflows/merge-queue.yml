# Run the protected deployment for the exact merge candidate.
name: Live integration tests

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: merge-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: live integration tests
    uses: ./.github/workflows/live-integration.yml
