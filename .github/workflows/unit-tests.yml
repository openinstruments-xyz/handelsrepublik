# This workflow executes untrusted pull-request code. Its environment must
# remain secret-free and must not access privileged external resources.
name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Unit Tests
      deployment: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: configure test result path
        run: echo "CI_TEST_RESULTS_FILE=$RUNNER_TEMP/handelsrepublik-test-results.ndjson" >> "$GITHUB_ENV"
      - name: run unit test suite
        continue-on-error: true
        run: npm run test:ci:record -- unit.tests "Unit test suite" -- npm test
      - name: publish test result table
        if: always()
        run: npm run test:ci:summary -- "Unit test results"
