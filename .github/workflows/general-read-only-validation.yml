name: sessions, account, instrument discovery/details, derivative catalog, candles, orders, portfolio, timeline, documents, taxes, payments

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1,11 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-integration-tests-main
  queue: max
  cancel-in-progress: false

jobs:
  live-read-only:
    name: run general read-only live validations
    if: github.repository == 'VIEWVIEWVIEW/handelsrepublik' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Live Integration Tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: configure ephemeral session path
        run: |
          echo "TR_SESSION_FILE=$RUNNER_TEMP/trade-republic-session.json" >> "$GITHUB_ENV"
          echo "CI_TEST_RESULTS_FILE=$RUNNER_TEMP/handelsrepublik-test-results.ndjson" >> "$GITHUB_ENV"
      - name: materialize encrypted test session
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: node --import tsx scripts/ci-session.ts materialize "$TR_SESSION_FILE"
      - name: refresh Trade Republic session
        run: node --import tsx scripts/ci-session.ts refresh "$TR_SESSION_FILE"
      - name: mark live session ready
        id: live-ready
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: run general read-only live validations concurrently
        if: ${{ !cancelled() && steps.live-ready.outcome == 'success' }}
        run: npm run test:integration:read
      - name: rotate encrypted GitHub session secret
        if: ${{ always() && steps.live-ready.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
        run: gh secret set TR_SESSION_JSON --env "Live Integration Tests" --repo "$GITHUB_REPOSITORY" < "$TR_SESSION_FILE"
      - name: remove materialized session
        if: always()
        run: rm -f "$TR_SESSION_FILE"
      - name: publish test result table
        if: always()
        run: npm run test:ci:summary -- "General read-only live results"
