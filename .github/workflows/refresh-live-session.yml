name: Refresh live session

on:
  schedule:
    - cron: "17 */2 * * *"
    - cron: "0 15 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-republic-live-session
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Live Integration Tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: materialize the saved session
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: |
          umask 077
          printf '%s' "$TR_SESSION_JSON" > "$RUNNER_TEMP/tr-session.json"
      - name: refresh the saved session
        id: refresh
        env:
          TR_SESSION_FILE: ${{ runner.temp }}/tr-session.json
        run: npm run ci:reauth -- --check-session
      - name: install browser for PIN login
        if: steps.refresh.outputs.session_valid == 'false' && github.event_name == 'schedule' && github.event.schedule == '0 15 * * *' && github.run_attempt == 1
        run: npx playwright install --with-deps chromium
      - name: log in with PIN and wait up to two minutes for app approval
        id: pin
        if: steps.refresh.outputs.session_valid == 'false' && github.event_name == 'schedule' && github.event.schedule == '0 15 * * *' && github.run_attempt == 1
        env:
          TR_SESSION_FILE: ${{ runner.temp }}/tr-session.json
          TR_PHONE_NUMBER: ${{ secrets.TR_PHONE_NUMBER }}
          TR_PIN: ${{ secrets.TR_PIN }}
          TR_LOGIN_SCHEDULE: ${{ github.event.schedule }}
        run: npm run ci:reauth -- --pin
      - name: store the refreshed protected-environment secrets
        if: steps.refresh.outputs.session_valid == 'true' || steps.pin.outputs.session_valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
          TR_SESSION_MANAGEMENT_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
        run: |
          gh secret set TR_SESSION_JSON \
            --body "$(cat "$RUNNER_TEMP/tr-session.json")" \
            --env "Live Integration Tests"
          gh secret set GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION \
            --body "$TR_SESSION_MANAGEMENT_TOKEN" \
            --env "Live Integration Tests"
      - name: report unavailable session
        if: steps.refresh.outputs.session_valid == 'false' && steps.pin.outputs.session_valid != 'true'
        run: echo "Saved session unavailable. New login is reserved for the daily 15:00 Europe/Berlin run." >> "$GITHUB_STEP_SUMMARY"
      - name: delete the saved session
        if: always()
        run: rm -f "$RUNNER_TEMP/tr-session.json"
