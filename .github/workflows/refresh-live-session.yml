name: Refresh live session

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-integration-tests-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Live Integration Tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: materialize the saved session
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: |
          umask 077
          printf '%s' "$TR_SESSION_JSON" > "$RUNNER_TEMP/tr-session.json"
      - name: refresh the saved session
        env:
          TR_SESSION_FILE: ${{ runner.temp }}/tr-session.json
        run: npm run ci:reauth -- --refresh
      - name: store the refreshed protected-environment secrets
        env:
          GH_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
          TR_SESSION_MANAGEMENT_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
        run: |
          gh secret set TR_SESSION_JSON \
            --body "$(cat "$RUNNER_TEMP/tr-session.json")" \
            --env "Live Integration Tests"
          gh secret set GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION \
            --body "$TR_SESSION_MANAGEMENT_TOKEN" \
            --env "Live Integration Tests"
      - name: delete the saved session
        if: always()
        run: rm -f "$RUNNER_TEMP/tr-session.json"
