name: migrate session secret token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: copy token to clearer secret name
    if: >-
      github.repository == 'VIEWVIEWVIEW/handelsrepublik' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'VIEWVIEWVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: trade-republic-tests
    env:
      GH_TOKEN: ${{ secrets.TR_SECRET_ROTATION_TOKEN }}
      SOURCE_TOKEN: ${{ secrets.TR_SECRET_ROTATION_TOKEN }}
    steps:
      - name: Copy token without exposing it
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$SOURCE_TOKEN" | gh secret set GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION --env trade-republic-tests --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
