# Quality and unit tests run without live access. The protected environment is
# entered only after both jobs succeed and a required reviewer approves it.
name: Pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: verify committed distribution
        run: git diff --exit-code -- dist

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  live-integration:
    name: Live Integration
    needs: [quality, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Live Integration Tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: materialize the saved session
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: |
          umask 077
          printf '%s' "$TR_SESSION_JSON" > "$RUNNER_TEMP/tr-session.json"
      - name: refresh the saved session
        env:
          TR_SESSION_FILE: ${{ runner.temp }}/tr-session.json
        run: npm run ci:reauth -- --refresh
      - name: persist the refreshed session
        env:
          GH_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
        run: |
          gh secret set TR_SESSION_JSON \
            --repo "$GITHUB_REPOSITORY" \
            --env "Live Integration Tests" \
            < "$RUNNER_TEMP/tr-session.json"
      - name: run live integration tests
        env:
          TR_SESSION_FILE: ${{ runner.temp }}/tr-session.json
        run: npm run test:integration
      - name: delete the saved session
        if: always()
        run: rm -f "$RUNNER_TEMP/tr-session.json"
