name: Merge gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    uses: ./.github/workflows/unit-tests.yml

  quality:
    name: package checks
    uses: ./.github/workflows/quality.yml

  live-preview:
    name: live suites awaiting merge queue
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [unit, quality]
    uses: ./.github/workflows/live-validation.yml

  live:
    name: independently reported live suites
    if: >-
      always() && github.event_name == 'merge_group' &&
      needs.unit.result == 'success' && needs.quality.result == 'success'
    needs: [unit, quality]
    uses: ./.github/workflows/live-validation.yml
    secrets: inherit

  merge-gate:
    name: Merge gate / merge gate
    if: ${{ always() }}
    needs:
      - unit
      - quality
      - live-preview
      - live
    runs-on: ubuntu-latest
    steps:
      - name: require the checks selected for this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          UNIT_RESULT: ${{ needs.unit.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          LIVE_PREVIEW_RESULT: ${{ needs.live-preview.result }}
          LIVE_RESULT: ${{ needs.live.result }}
        run: |
          set -eu

          require_result() {
            label="$1"
            actual="$2"
            expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label concluded '$actual'; expected '$expected'."
              return 1
            fi
          }

          require_result "unit tests" "$UNIT_RESULT" "success"
          require_result "package checks" "$QUALITY_RESULT" "success"

          expected_preview_result="skipped"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            expected_preview_result="success"
          fi
          require_result "live suite PR entries" "$LIVE_PREVIEW_RESULT" "$expected_preview_result"

          expected_live_result="skipped"
          if [ "$EVENT_NAME" = "merge_group" ] &&
             [ "$UNIT_RESULT" = "success" ] && [ "$QUALITY_RESULT" = "success" ]; then
            expected_live_result="success"
          fi
          require_result "independently reported live suites" "$LIVE_RESULT" "$expected_live_result"
