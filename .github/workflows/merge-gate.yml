name: Merge gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    uses: ./.github/workflows/unit-tests.yml

  quality:
    name: package checks
    uses: ./.github/workflows/quality.yml

  consolidated-live:
    name: account, market data, and reversible mutations
    if: github.event_name == 'merge_group'
    needs: [unit, quality]
    uses: ./.github/workflows/validate-account-market-data-and-reversible-mutations.yml
    secrets: inherit

  closed-limit-order:
    name: closed-market limit-order rejection
    if: github.event_name == 'merge_group'
    needs: [unit, quality]
    uses: ./.github/workflows/validate-closed-venue-limit-order-rejection.yml
    secrets: inherit

  closed-market-order:
    name: closed-market market-order rejection
    if: github.event_name == 'merge_group'
    needs: [unit, quality]
    uses: ./.github/workflows/validate-closed-venue-market-order-rejection.yml
    secrets: inherit

  open-limit-order:
    name: open-market limit-order lifecycle
    if: github.event_name == 'merge_group'
    needs: [unit, quality]
    uses: ./.github/workflows/validate-open-venue-limit-order-lifecycle.yml
    secrets: inherit

  closed-market-data:
    name: closed-market trading availability
    if: github.event_name == 'merge_group'
    needs: [unit, quality]
    uses: ./.github/workflows/validate-order-destinations-during-closed-market-hours.yml
    secrets: inherit

  merge-gate:
    name: Merge gate / merge gate
    if: ${{ always() }}
    needs:
      - unit
      - quality
      - consolidated-live
      - closed-limit-order
      - closed-market-order
      - open-limit-order
      - closed-market-data
    runs-on: ubuntu-latest
    steps:
      - name: require the checks selected for this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          UNIT_RESULT: ${{ needs.unit.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONSOLIDATED_LIVE_RESULT: ${{ needs.consolidated-live.result }}
          CLOSED_LIMIT_ORDER_RESULT: ${{ needs.closed-limit-order.result }}
          CLOSED_MARKET_ORDER_RESULT: ${{ needs.closed-market-order.result }}
          OPEN_LIMIT_ORDER_RESULT: ${{ needs.open-limit-order.result }}
          CLOSED_MARKET_DATA_RESULT: ${{ needs.closed-market-data.result }}
        run: |
          set -eu

          require_result() {
            label="$1"
            actual="$2"
            expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label concluded '$actual'; expected '$expected'."
              return 1
            fi
          }

          require_result "unit tests" "$UNIT_RESULT" "success"
          require_result "package checks" "$QUALITY_RESULT" "success"

          expected_live_result="skipped"
          if [ "$EVENT_NAME" = "merge_group" ]; then
            expected_live_result="success"
          fi

          require_result "account, market data, and reversible mutations" "$CONSOLIDATED_LIVE_RESULT" "$expected_live_result"
          require_result "closed-market limit-order rejection" "$CLOSED_LIMIT_ORDER_RESULT" "$expected_live_result"
          require_result "closed-market market-order rejection" "$CLOSED_MARKET_ORDER_RESULT" "$expected_live_result"
          require_result "open-market limit-order lifecycle" "$OPEN_LIMIT_ORDER_RESULT" "$expected_live_result"
          require_result "closed-market trading availability" "$CLOSED_MARKET_DATA_RESULT" "$expected_live_result"
