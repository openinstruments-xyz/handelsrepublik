name: Live validation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1,11 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      suite:
        description: Live suite to run
        required: true
        type: choice
        default: all
        options:
          - all
          - read-only
          - mutations
          - open-market-data
          - closed-market-data
          - closed-limit-order-rejection
          - closed-market-order-rejection
          - open-limit-order-lifecycle
          - weekend-limit-order-rejection
      confirm_order_request:
        description: I understand selected order suites send real orders designed to be rejected or cancelled.
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      suite:
        description: Live suite to run
        required: false
        type: string
        default: all
      confirm_order_request:
        description: Allow order-request suites for an explicitly dispatched call
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: select independently reported suites
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: plan
        name: select suites without accessing the live session
        env:
          CI_LIVE_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || (github.event_name == 'push' || github.event_name == 'schedule') && 'automatic' || inputs.suite || 'all' }}
        run: node scripts/ci-plan-live-suites.mjs

  execute:
    name: refresh, run selected suites, and persist
    needs: plan
    if: github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    concurrency:
      group: live-integration-tests-main
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: Live Integration Tests
    outputs:
      status_read_only: ${{ steps.live-suites.outputs.status_read_only }}
      status_mutations: ${{ steps.live-suites.outputs.status_mutations }}
      status_open_market_data: ${{ steps.live-suites.outputs.status_open_market_data }}
      status_closed_market_data: ${{ steps.live-suites.outputs.status_closed_market_data }}
      status_closed_limit_order_rejection: ${{ steps.live-suites.outputs.status_closed_limit_order_rejection }}
      status_closed_market_order_rejection: ${{ steps.live-suites.outputs.status_closed_market_order_rejection }}
      status_open_limit_order_lifecycle: ${{ steps.live-suites.outputs.status_open_limit_order_lifecycle }}
      status_weekend_limit_order_rejection: ${{ steps.live-suites.outputs.status_weekend_limit_order_rejection }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: configure ephemeral result and session paths
        run: |
          echo "TR_SESSION_FILE=$RUNNER_TEMP/trade-republic-session.json" >> "$GITHUB_ENV"
          echo "CI_TEST_RESULTS_FILE=$RUNNER_TEMP/handelsrepublik-test-results.ndjson" >> "$GITHUB_ENV"
          echo "CI_LIVE_SUITE_REPORT_FILE=$RUNNER_TEMP/handelsrepublik-live-suite-report.json" >> "$GITHUB_ENV"
      - name: materialize encrypted test session
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: node --import tsx scripts/ci-session.ts materialize "$TR_SESSION_FILE"
      - name: refresh Trade Republic session once
        id: live-ready
        run: node --import tsx scripts/ci-session.ts refresh "$TR_SESSION_FILE"
      - name: run selected live suites independently
        id: live-suites
        if: ${{ !cancelled() && steps.live-ready.outcome == 'success' }}
        continue-on-error: true
        env:
          CI_LIVE_SUITE: ${{ needs.plan.outputs.selection }}
          CI_LIVE_ALLOW_ORDER_REQUESTS: ${{ github.event_name != 'workflow_dispatch' || (github.actor == 'VIEWVIEWVIEW' && github.ref == 'refs/heads/main' && inputs.confirm_order_request) }}
        run: npm run test:integration:consolidated
      - name: rotate encrypted GitHub session secret
        if: ${{ always() && steps.live-ready.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_CLI_TOKEN_USED_TO_UPDATE_TR_SESSION }}
        run: gh secret set TR_SESSION_JSON --repo "$GITHUB_REPOSITORY" < "$TR_SESSION_FILE"
      - name: remove materialized session
        if: always()
        run: rm -f "$TR_SESSION_FILE"
      - name: publish structured badge results
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.live-suites.outcome != 'skipped' }}
        continue-on-error: true
        env:
          CI_BADGE_RESULTS_BASE_URL: https://handelsrepublik-ci-badges.99o.workers.dev
          CI_BADGE_INGEST_TOKEN: ${{ secrets.CI_BADGE_INGEST_TOKEN }}
        run: npm run test:ci:publish-live
      - name: publish complete test result table
        if: always()
        continue-on-error: true
        run: npm run test:ci:summary -- "Live validation results"

  report:
    name: Live / ${{ matrix.suite.name }}
    needs: [plan, execute]
    if: ${{ always() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    runs-on: ubuntu-latest
    steps:
      - name: report independent suite result
        env:
          RUN_EVENT: ${{ github.event_name }}
          SUITE_NAME: ${{ matrix.suite.name }}
          SUITE_STATUS: ${{ needs.execute.outputs[matrix.suite.output] }}
        run: |
          exit_code=0
          case "$SUITE_STATUS" in
            passed)
              result="✅ Passed"
              note="All selected checks passed."
              ;;
            skipped)
              result="⏭️ Time-gated"
              note="This suite was not eligible for the current Berlin time window or manual confirmation."
              ;;
            *)
              if [ "$RUN_EVENT" = "pull_request" ]; then
                result="⏭️ Merge queue"
                note="The live suite runs after this pull request enters the trusted merge queue."
              else
                echo "::error::$SUITE_NAME failed or did not report from the shared live executor."
                result="❌ Failed"
                note="One or more checks failed or the executor stopped before reporting. See its log."
                exit_code=1
              fi
              ;;
          esac
          {
            echo "## $SUITE_NAME"
            echo ""
            echo "| Suite | Result | Notes |"
            echo "|---|:---:|---|"
            echo "| $SUITE_NAME | $result | $note |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"
