name: approved PR live read integration

on:
  workflow_run:
    workflows:
      - PR-safe unit tests
    types: [completed]

permissions: {}

jobs:
  authorize:
    name: authorize exact PR commit
    if: >-
      github.repository == 'VIEWVIEWVIEW/handelsrepublik' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head_repository: ${{ steps.gate.outputs.head_repository }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - id: gate
        name: verify PR identity, exact SHA, and all secret-free checks
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100")"
          matches="$(jq --arg sha "$EXPECTED_HEAD_SHA" '[.[] | select(.head.sha == $sha)]' <<< "$prs")"

          if [ "$(jq 'length' <<< "$matches")" -ne 1 ]; then
            echo "::error::Expected exactly one open pull request for $EXPECTED_HEAD_SHA."
            exit 1
          fi

          pr="$(jq '.[0]' <<< "$matches")"
          pr_number="$(jq -r '.number' <<< "$pr")"
          head_repository="$(jq -r '.head.repo.full_name' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          base_branch="$(jq -r '.base.ref' <<< "$pr")"
          state="$(jq -r '.state' <<< "$pr")"

          if [ "$head_sha" != "$EXPECTED_HEAD_SHA" ] ||
             [ "$base_branch" != "main" ] ||
             [ "$state" != "open" ]; then
            echo "::error::The pull request no longer matches the completed unit-test run."
            exit 1
          fi

          quality_conclusion=""
          for attempt in $(seq 1 30); do
            runs="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head_sha&event=pull_request&per_page=100"
            )"
            quality_conclusion="$(
              jq -r \
                '[.workflow_runs[] |
                  select(.name == "PR-safe typecheck, build, distribution")][0].conclusion // ""' \
                <<< "$runs"
            )"

            if [ "$quality_conclusion" = "success" ]; then
              break
            fi
            if [[ "$quality_conclusion" =~ ^(failure|cancelled|timed_out|action_required|startup_failure)$ ]]; then
              echo "::error::The PR-safe typecheck/build workflow concluded $quality_conclusion."
              exit 1
            fi
            sleep 20
          done

          if [ "$quality_conclusion" != "success" ]; then
            echo "::error::The exact PR commit has no successful typecheck/build workflow."
            exit 1
          fi

          environment="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/environments/Live%20Integration%20Tests"
          )"
          protected_by_owner="$(
            jq -r \
              '(.can_admins_bypass == false) and
               ([.protection_rules[]? |
                 select(.type == "required_reviewers") |
                 .reviewers[]? |
                 select(.reviewer.login == "VIEWVIEWVIEW")] |
                 length > 0)' \
              <<< "$environment"
          )"
          if [ "$protected_by_owner" != "true" ]; then
            echo "::error::Live Integration Tests requires VIEWVIEWVIEW as reviewer and administrator bypass disabled."
            exit 1
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=pending \
            -f context='live/read-integration' \
            -f description='Waiting for authorization and the live read integration'

          echo "head_repository=$head_repository" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

  live-read-integration:
    name: live read integration
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      pull-requests: read
    environment: Live Integration Tests
    concurrency:
      group: live-integration-tests-main
      queue: max
      cancel-in-progress: false
    steps:
      - name: revalidate the approved SHA before checkout
        env:
          EXPECTED_HEAD_REPOSITORY: ${{ needs.authorize.outputs.head_repository }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_repository="$(jq -r '.head.repo.full_name' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          base_branch="$(jq -r '.base.ref' <<< "$pr")"
          state="$(jq -r '.state' <<< "$pr")"

          if [ "$head_repository" != "$EXPECTED_HEAD_REPOSITORY" ] ||
             [ "$head_sha" != "$EXPECTED_HEAD_SHA" ] ||
             [ "$base_branch" != "main" ] ||
             [ "$state" != "open" ]; then
            echo "::error::The pull request changed after authorization; approve its new checks instead."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.authorize.outputs.head_repository }}
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: repeat secret-free checks before loading the live session
        run: |
          npm test
          npm run typecheck
          npm run build
          git diff --exit-code -- dist
      - name: configure ephemeral result and session paths
        run: |
          echo "CI_TEST_RESULTS_FILE=$RUNNER_TEMP/handelsrepublik-test-results.ndjson" >> "$GITHUB_ENV"
          echo "TR_SESSION_FILE=$RUNNER_TEMP/trade-republic-session.json" >> "$GITHUB_ENV"
      - name: materialize the shared encrypted session without rotating it
        env:
          TR_SESSION_JSON: ${{ secrets.TR_SESSION_JSON }}
        run: node --import tsx scripts/ci-session.ts materialize "$TR_SESSION_FILE"
      - name: run the approved read-only live integration suite
        run: npm run test:integration:read
      - name: remove the ephemeral session
        if: always()
        run: rm -f -- "$TR_SESSION_FILE"
      - name: publish live read integration results
        if: always()
        run: npm run test:ci:summary -- "Approved PR live read integration"

  publish-status:
    name: publish live check status
    needs:
      - authorize
      - live-read-integration
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: publish the final result on the PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          LIVE_RESULT: ${{ needs.live-read-integration.result }}
        run: |
          if [ "$LIVE_RESULT" = "success" ]; then
            state=success
            description="Approved live read integration passed"
          else
            state=failure
            description="Live read integration failed"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context='live/read-integration' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
